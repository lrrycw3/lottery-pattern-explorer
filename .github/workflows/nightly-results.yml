name: Nightly lottery results

# Keeps the built-in Fantasy 5, Daily 3, Daily 4 and Daily 5 datasets
# current without any manual approval: the workflow reads the official
# Michigan Lottery Past Results tool, merges new draws into the CSVs,
# and commits them. Runs after the 7:29 p.m. ET draws.
on:
  schedule:
    # 21:41 EST (02:41 UTC); 22:41 EDT in daylight time. Either way
    # it is after the evening draws.
    - cron: "41 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        timeout-minutes: 10
        run: |
          pip install playwright
          # No --with-deps: GitHub's ubuntu runner already carries the
          # browser libraries, and --with-deps stalled for an hour on
          # the Ubuntu font-mirror downloads in run #1.
          playwright install chromium

      - name: Update results from Michigan Lottery
        timeout-minutes: 15
        run: python scripts/update_results.py

      - name: Upload debug artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-pages
          path: |
            debug-*.png
            debug-*.html

      - name: Commit and push if the data changed
        run: |
          git config user.name "lottery-results-bot"
          git config user.email "lottery-results-bot@users.noreply.github.com"
          git add data/fantasy5_history.csv data/daily3_history.csv data/daily4_history.csv data/daily5_history.csv
          if git diff --cached --quiet; then
            echo "No new draws — nothing to commit."
          else
            git commit -m "Nightly results: $(date -u +%Y-%m-%d)"
            git push
          fi
