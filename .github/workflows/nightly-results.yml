name: Nightly lottery results

# Keeps the built-in Fantasy 5, Daily 3, Daily 4 and Daily 5 datasets
# current without any manual approval: the workflow reads the official
# Michigan Lottery Past Results CSV export, merges new draws into the
# CSVs, and commits them. Runs at 11:00 a.m. ET, before the evening
# draws; the export lags a day, so each run picks up yesterday's draws.
#
# 2026-11-26: rewritten for the Lottery's redesigned site. The old
# Playwright flow (old /resources/number-tools page, Start/End text
# boxes, "Get Results" button) died when that page started 404ing
# (runs #23-25 failed). The new flow is a plain HTTP GET of the
# public CSV export behind the Number Tools page's Download CSV link,
# so no browser and no Playwright install are needed anymore.
on:
  schedule:
    # 11:00 EST (16:00 UTC); 12:00 EDT in daylight time. Runs
    # before the evening draws; the export lags a day, so this
    # picks up yesterday's draws by late morning.
    - cron: "0 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update results from Michigan Lottery
        timeout-minutes: 5
        run: python scripts/update_results.py

      - name: Commit and push if the data changed
        run: |
          git config user.name "lottery-results-bot"
          git config user.email "lottery-results-bot@users.noreply.github.com"
          git add data/fantasy5_history.csv data/daily3_history.csv data/daily4_history.csv data/daily5_history.csv
          if git diff --cached --quiet; then
            echo "No new draws — nothing to commit."
          else
            git commit -m "Nightly results: $(date -u +%Y-%m-%d)"
            git push
          fi
